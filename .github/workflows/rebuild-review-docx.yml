name: Rebuild Hebrew review DOCX files

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/rebuild-review-docx.yml'
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: python -m pip install --disable-pip-version-check lxml

      - name: Skip historical rebuild when archived outputs already exist
        shell: bash
        run: |
          if [[ -f 'archive/docx/כתב_יד_עם_הערות_עריכה_E0001-E1002_עם_השלמת_פער_E0022-E0105.docx' ]] && [[ -f 'archive/docx/כתב_יד_עם_הערות_עריכה_E0001-E1002_עם_השלמת_פער_E0022-E0105_סשן_20261106_P02520-P02554.docx' ]]; then
            echo "Historical rebuild outputs already exist in archive/docx; skipping to prevent overwriting archived review artifacts."
            exit 0
          fi

      - name: Test comment-label parsing and validation
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Reconstruct and run review-document builder
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('scripts/rebuild_review_docs.py.gz.b64').read_text(encoding='ascii').strip()
          script = gzip.decompress(base64.b64decode(encoded))
          Path('scripts/rebuild_review_docs.py').write_bytes(script)
          PY
          python scripts/rebuild_review_docs.py

      - name: Append first reconstructed gap batch
        run: python scripts/append_gap_comments.py

      - name: Append session-specific editor comments to Word
        run: python scripts/append_session_comments.py

      - name: Resolve output DOCX path for visual QA
        shell: bash
        run: |
          output="$(python -c 'import json; print(json.load(open("scripts/session_comments.json", encoding="utf-8"))["output_docx"])')"
          echo "OUTPUT_DOCX=$output" >> "$GITHUB_ENV"

      - name: Upload generated DOCX for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: review-docx-${{ github.run_id }}
          path: ${{ env.OUTPUT_DOCX }}
          if-no-files-found: error
          retention-days: 2

      - name: Commit generated documents and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_DOCX" 'editorial-reports/word-comment-logs/דוח_הערות_Word_סשן_*.md' 'editorial-reports/word-comment-logs/דוח_השלמת_פער_הערות_E0022-E0105.md' 'project-management/יומן-דחיפות-והמשכיות.md'
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build cumulative review DOCX and append session comments"
          git reset --hard
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main