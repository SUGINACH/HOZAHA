name: Rebuild Hebrew review DOCX files

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/rebuild-review-docx.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: python -m pip install --disable-pip-version-check lxml

      - name: Reconstruct and run review-document builder
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('scripts/rebuild_review_docs.py.gz.b64').read_text(encoding='ascii').strip()
          script = gzip.decompress(base64.b64decode(encoded))
          Path('scripts/rebuild_review_docs.py').write_bytes(script)
          PY
          python scripts/rebuild_review_docs.py

      - name: Append first reconstructed gap batch
        run: python scripts/append_gap_comments.py

      - name: Commit generated documents and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.docx' 'דוח_תיקון_גופן_והשלמת_הערות.md' 'דוח_השלמת_פער_הערות_E0022-E0105.md' 'יומן-דחיפות-והמשכיות.md'
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build cumulative Hebrew review document through E-0105"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main