name: Correct identified Word editorial comment source references

on:
  push:
    branches: [main]
    paths:
      - 'review_batches/correct-source-annotations.json'
      - 'review_batches/correct-source-annotations-2.json'
      - 'review_batches/correct-source-annotations-3.json'
      - 'review_batches/correct-source-annotations-4.json'
      - 'review_batches/correct-source-annotations-5.json'
      - 'review_batches/correct-source-annotations-6.json'
      - 'review/replace_review_comments.py'
      - '.github/workflows/correct-editorial-source-comments.yml'
  workflow_dispatch:

concurrency:
  group: hozaha-docx-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_CORRECTION_CONFIG: review_batches/correct-source-annotations-6.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DOCX XML tooling
        run: python -m pip install --disable-pip-version-check lxml
      - name: Prepare the latest main before generating outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Correct verified editorial comment and commit without rebase races
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DOCX="$(python -c 'import json,os; print(json.load(open(os.environ["REVIEW_CORRECTION_CONFIG"], encoding="utf-8"))["output_docx"])')"
          REPORT_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["REVIEW_CORRECTION_CONFIG"], encoding="utf-8"))["report_path"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Correction commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            if git cat-file -e "origin/main:$OUTPUT_DOCX" 2>/dev/null; then
              echo "The corrected DOCX already exists on main; no duplicate output will be generated."
              exit 0
            fi
            python review/replace_review_comments.py
            git add -- "$OUTPUT_DOCX" "$REPORT_PATH" 'יומן-דחיפות-והמשכיות.md'
            git commit -m "Correct verified source references in Word review comments"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with a new main commit; retrying from the latest main."
          done
          exit 1
