name: Audit manuscript DOCX integrity

on:
  push:
    branches: [main]
    paths:
      - 'audit/**'
      - '*.docx'
      - '.github/workflows/audit-manuscript-docx.yml'
  workflow_dispatch:

concurrency:
  group: hozaha-docx-audit-v3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate from latest main and commit audit outputs without merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Audit refresh attempt $attempt from latest main"
            git fetch origin main
            git reset --hard origin/main
            python audit/inspect_docx.py
            python audit/extract_review_window.py
            python audit/extract_next_review_window.py
            python audit/extract_P02746_window.py
            python audit/extract_P02796_window.py
            python audit/extract_P02846_window.py
            python audit/extract_P02896_window.py
            python audit/extract_P02946_window.py
            python audit/extract_P02996_window.py
            python audit/extract_P03046_window.py
            python audit/extract_P03146_window.py
            python audit/extract_P03196_window.py
            python audit/extract_P03246_window.py
            python audit/extract_P03296_window.py
            python audit/extract_P03346_window.py
            python audit/extract_P03396_window.py
            python audit/extract_P03446_window.py
            python audit/extract_P03496_window.py
            python audit/extract_P03546_window.py
            python audit/extract_P03596_window.py
            python audit/extract_P03696_window.py
            python audit/extract_P03746_window.py
            python audit/extract_P03796_window.py
            python audit/extract_P03846_window.py
            python audit/extract_P03896_window.py
            python audit/extract_P03946_window.py
            python audit/extract_P03996_window.py
            python audit/extract_P04046_window.py
            python audit/extract_P04096_window.py
            python audit/extract_P04146_window.py
            python audit/extract_P04196_window.py
            python audit/extract_P04246_window.py
            python audit/extract_P04296_window.py
            python audit/extract_P04346_window.py
            python audit/extract_P04396_window.py
            python audit/extract_P04446_window.py
            python audit/extract_P04496_window.py
            python audit/extract_P04546_window.py
            python audit/extract_P04596_window.py
            git add -- 'editorial-reports/word-comment-logs/דוח_ביקורת_מבנית_DOCX.md' 'review-windows/' 'project-management/יומן-דחיפות-והמשכיות.md'
            if git diff --cached --quiet; then
              echo "Audit outputs are already current."
              exit 0
            fi
            git commit -m "Refresh DOCX audit and manuscript review windows"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; all derived windows will be regenerated from the new main."
          done
          exit 1
