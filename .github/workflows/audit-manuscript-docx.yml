name: Audit manuscript DOCX integrity

on:
  push:
    branches: [main]
    paths:
      - 'audit/**'
      - '*.docx'
      - '.github/workflows/audit-manuscript-docx.yml'
  workflow_dispatch:

concurrency:
  group: hozaha-docx-audit-v3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit DOCX packages without modifying them
        run: python audit/inspect_docx.py
      - name: Extract next manuscript review window without modifying DOCX
        run: python audit/extract_review_window.py
      - name: Extract next review window from latest cumulative DOCX without modifying it
        run: python audit/extract_next_review_window.py
      - name: Extract P02746 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P02746_window.py
      - name: Extract P02796 review window from corrected cumulative DOCX without modifying it
        run: python audit/extract_P02796_window.py
      - name: Extract P02846 review window from final source-corrected DOCX without modifying it
        run: python audit/extract_P02846_window.py
      - name: Extract P02896 review window from latest source-corrected cumulative DOCX without modifying it
        run: python audit/extract_P02896_window.py
      - name: Extract P02946 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P02946_window.py
      - name: Extract P02996 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P02996_window.py
      - name: Extract P03046 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03046_window.py
      - name: Extract P03146 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03146_window.py
      - name: Extract P03196 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03196_window.py
      - name: Extract P03246 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03246_window.py
      - name: Extract P03296 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03296_window.py
      - name: Extract P03346 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03346_window.py
      - name: Extract P03396 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03396_window.py
      - name: Extract P03446 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03446_window.py
      - name: Extract P03496 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03496_window.py
      - name: Extract P03546 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03546_window.py
      - name: Extract P03596 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P03596_window.py
      - name: Regenerate from latest main and commit audit outputs without merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Audit refresh attempt $attempt from latest main"
            git fetch origin main
            git reset --hard origin/main
            python audit/inspect_docx.py
            python audit/extract_review_window.py
            python audit/extract_next_review_window.py
            python audit/extract_P02746_window.py
            python audit/extract_P02796_window.py
            python audit/extract_P02846_window.py
            python audit/extract_P02896_window.py
            python audit/extract_P02946_window.py
            python audit/extract_P02996_window.py
            python audit/extract_P03046_window.py
            python audit/extract_P03146_window.py
            python audit/extract_P03196_window.py
            python audit/extract_P03246_window.py
            python audit/extract_P03296_window.py
            python audit/extract_P03346_window.py
            python audit/extract_P03396_window.py
            python audit/extract_P03446_window.py
            python audit/extract_P03496_window.py
            python audit/extract_P03546_window.py
            python audit/extract_P03596_window.py
            git add -- 'דוח_ביקורת_מבנית_DOCX.md' 'חלון-כתב-יד-להמשך-ביקורת-P02555.md' 'חלון-כתב-יד-להמשך-ביקורת-P02595.md' 'חלון-כתב-יד-להמשך-ביקורת-P02646.md' 'חלון-כתב-יד-להמשך-ביקורת-P02696.md' 'חלון-כתב-יד-להמשך-ביקורת-P02746.md' 'חלון-כתב-יד-להמשך-ביקורת-P02796.md' 'חלון-כתב-יד-להמשך-ביקורת-P02846.md' 'חלון-כתב-יד-להמשך-ביקורת-P02896.md' 'חלון-כתב-יד-להמשך-ביקורת-P02946.md' 'חלון-כתב-יד-להמשך-ביקורת-P02996.md' 'חלון-כתב-יד-להמשך-ביקורת-P03046.md' 'חלון-כתב-יד-להמשך-ביקורת-P03146.md' 'חלון-כתב-יד-להמשך-ביקורת-P03196.md' 'חלון-כתב-יד-להמשך-ביקורת-P03246.md' 'חלון-כתב-יד-להמשך-ביקורת-P03296.md' 'חלון-כתב-יד-להמשך-ביקורת-P03346.md' 'חלון-כתב-יד-להמשך-ביקורת-P03396.md' 'חלון-כתב-יד-להמשך-ביקורת-P03446.md' 'חלון-כתב-יד-להמשך-ביקורת-P03496.md' 'חלון-כתב-יד-להמשך-ביקורת-P03546.md' 'חלון-כתב-יד-להמשך-ביקורת-P03596.md' 'יומן-דחיפות-והמשכיות.md'
            if git diff --cached --quiet; then
              echo "Audit outputs are already current."
              exit 0
            fi
            git commit -m "Refresh DOCX audit and manuscript review windows"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; all derived windows will be regenerated from the new main."
          done
          exit 1
