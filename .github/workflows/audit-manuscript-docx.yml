name: Audit manuscript DOCX integrity

on:
  push:
    branches: [main]
    paths:
      - 'audit/**'
      - '*.docx'
      - '.github/workflows/audit-manuscript-docx.yml'
  workflow_dispatch:

concurrency:
  group: hozaha-docx-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit DOCX packages without modifying them
        run: python audit/inspect_docx.py
      - name: Extract next manuscript review window without modifying DOCX
        run: python audit/extract_review_window.py
      - name: Extract next review window from latest cumulative DOCX without modifying it
        run: python audit/extract_next_review_window.py
      - name: Commit audit report, review window, and update work log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'דוח_ביקורת_מבנית_DOCX.md' 'חלון-כתב-יד-להמשך-ביקורת-P02555.md' 'חלון-כתב-יד-להמשך-ביקורת-P02595.md' 'חלון-כתב-יד-להמשך-ביקורת-P02646.md' 'יומן-דחיפות-והמשכיות.md'
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Extract next manuscript review window"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
