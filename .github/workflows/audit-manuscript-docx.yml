name: Audit manuscript DOCX integrity

on:
  push:
    branches: [main]
    paths:
      - 'audit/**'
      - '*.docx'
      - '.github/workflows/audit-manuscript-docx.yml'
  workflow_dispatch:

concurrency:
  group: hozaha-docx-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit DOCX packages without modifying them
        run: python audit/inspect_docx.py
      - name: Extract next manuscript review window without modifying DOCX
        run: python audit/extract_review_window.py
      - name: Extract next review window from latest cumulative DOCX without modifying it
        run: python audit/extract_next_review_window.py
      - name: Extract P02746 review window from latest cumulative DOCX without modifying it
        run: python audit/extract_P02746_window.py
      - name: Regenerate from latest main and commit audit outputs without merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Audit commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            python audit/inspect_docx.py
            python audit/extract_review_window.py
            python audit/extract_next_review_window.py
            git add -- 'דוח_ביקורת_מבנית_DOCX.md' 'חלון-כתב-יד-להמשך-ביקורת-P02555.md' 'חלון-כתב-יד-להמשך-ביקורת-P02595.md' 'חלון-כתב-יד-להמשך-ביקורת-P02646.md' 'חלון-כתב-יד-להמשך-ביקורת-P02696.md' 'חלון-כתב-יד-להמשך-ביקורת-P02746.md' 'יומן-דחיפות-והמשכיות.md'
            if git diff --cached --quiet; then
              echo "Audit outputs are already current."
              exit 0
            fi
            git commit -m "Refresh DOCX audit and manuscript review windows"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying from origin/main."
          done
          exit 1
