name: Extract final HOZAHA manuscript tail P04596-P04602

on:
  push:
    branches: [main]
    paths:
      - 'כתב_יד_S027_P04546-P04595.docx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hozaha-extract-final-tail-P04596
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and validate the final manuscript tail
        run: python audit/extract_P04596_window.py
      - name: Commit from latest main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Extraction commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            python audit/extract_P04596_window.py
            git add -- 'review-windows/חלון-כתב-יד-להמשך-ביקורת-P04596.md'
            if git diff --cached --quiet; then
              echo "Final review tail is already current."
              exit 0
            fi
            git commit -m "Extract final manuscript review tail P04596-P04602"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with a new main commit; retrying from latest main."
          done
          exit 1
